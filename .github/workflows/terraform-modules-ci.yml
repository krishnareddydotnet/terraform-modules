name: terraform-modules-ci

# Runs on every pull request to main. Checks only: there is no apply in a module repo.
on:
  pull_request:
    branches:
      - main

# Least privilege: the jobs only read the code.
permissions:
  contents: read

env:
  TF_VERSION: "1.17.1"
  TFLINT_VERSION: "v0.65.0"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved, a SHA cannot).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -backend=false: no state and no Azure login needed to validate.
      - name: terraform init + validate (every module and example)
        run: |
          for dir in modules/*/ examples/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint --init
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          # Avoids GitHub API rate limits when downloading the azurerm plugin.
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  checkov:
    name: checkov (policy as code)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails the PR on any security misconfiguration that is not skipped (with a reason) in .checkov.yaml.
      - name: Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: .
          config_file: .checkov.yaml
